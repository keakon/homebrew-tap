name: Homebrew formula

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ github.token }}

      - run: brew install keakon/tap/chord
      - run: brew test keakon/tap/chord
      - run: brew audit --strict keakon/tap/chord
